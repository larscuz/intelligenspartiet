<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title desc">
  <title id="title">Intelligenspartiet logo mark</title>
  <desc id="desc">Sirkelformet blått krets-symbol med power-ikon</desc>
  <defs>
    <radialGradient id="bg" cx="34%" cy="26%" r="85%">
      <stop offset="0%" stop-color="#1f7ed1" />
      <stop offset="62%" stop-color="#0a4a95" />
      <stop offset="100%" stop-color="#031a47" />
