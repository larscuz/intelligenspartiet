<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 260" role="img" aria-labelledby="title desc">
  <title id="title">Intelligenspartiet logo</title>
  <desc id="desc">Power-symbol og IP-monogram med teksten Intelligenspartiet</desc>
  <defs>
    <linearGradient id="coreFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2b6f" />
      <stop offset="55%" stop-color="#06498a" />
      <stop offset="100%" stop-color="#02183d" />
    </linearGradient>
    <linearGradient id="neonLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ef1ff" />
      <stop offset="100%" stop-color="#1ba9ff" />
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(18 0)">
    <circle cx="112" cy="110" r="90" fill="url(#coreFill)" stroke="#2dc7ff" stroke-width="4" />
    <circle cx="112" cy="110" r="101" fill="none" stroke="#63e7ff" stroke-width="3.2" opacity="0.85" />
    <circle cx="112" cy="110" r="78" fill="none" stroke="#2ec8ff" stroke-width="4" opacity="0.7" />

    <g stroke="url(#neonLine)" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#glow)">
      <path d="M112 52 V82" />
      <path d="M70 132 A42 42 0 1 1 154 132" />
    </g>

    <g stroke="#63e7ff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M20 110 H32" />
      <path d="M31 70 L41 77" />
      <path d="M65 38 L71 50" />
      <path d="M159 38 L153 50" />
      <path d="M193 70 L183 77" />
      <path d="M204 110 H192" />
      <path d="M193 150 L183 143" />
      <path d="M159 182 L153 170" />
      <path d="M65 182 L71 170" />
      <path d="M31 150 L41 143" />
      <circle cx="18" cy="110" r="4" />
      <circle cx="30" cy="68" r="4" />
      <circle cx="64" cy="36" r="4" />
      <circle cx="112" cy="24" r="4" />
      <circle cx="160" cy="36" r="4" />
      <circle cx="194" cy="68" r="4" />
      <circle cx="206" cy="110" r="4" />
      <circle cx="194" cy="152" r="4" />
      <circle cx="160" cy="184" r="4" />
      <circle cx="112" cy="196" r="4" />
      <circle cx="64" cy="184" r="4" />
      <circle cx="30" cy="152" r="4" />
    </g>
  </g>

  <line x1="298" y1="34" x2="298" y2="188" stroke="url(#neonLine)" stroke-width="4.5" />

  <text x="358" y="150" fill="#ffffff" font-family="Bebas Neue, Arial Black, Arial, sans-serif" font-size="172" font-weight="800" letter-spacing="4">IP</text>
  <text x="20" y="236" fill="#ffffff" font-family="Source Sans 3, Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="1.5">INTELLIGENSPARTIET</text>
</svg>
