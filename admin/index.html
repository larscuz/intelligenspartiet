<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Intelligenspartiet Admin</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo/intelligenspartiet-favicon.svg" />
  <link rel="shortcut icon" href="/assets/logo/intelligenspartiet-favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <main class="admin-shell">
    <header class="admin-header">
      <h1>Intelligenspartiet Admin</h1>
      <p>Kun for autorisert redigering av nettsted og video-prompter.</p>
    </header>

    <section class="card auth-card">
      <h2>Logg inn</h2>
      <p id="auth-mode" class="status">Sjekker oppsett ...</p>

      <div id="login-panel" class="auth-panel">
        <label for="login-email">Admin e-post</label>
        <input id="login-email" type="email" autocomplete="username" />

        <label for="login-password">Passord</label>
        <input id="login-password" type="password" autocomplete="current-password" />

        <div class="actions">
          <button id="login-button" type="button">Logg inn</button>
          <button id="logout-button" type="button">Logg ut</button>
          <button id="refresh-status" type="button">Oppdater status</button>
        </div>
      </div>

      <div id="setup-panel" class="auth-panel hidden">
        <h3>Første gangs oppsett</h3>
        <p>Sett passord første gang. Dette kan kun gjøres én gang.</p>

        <label for="setup-email">Admin e-post</label>
        <input id="setup-email" type="email" autocomplete="off" />

        <label for="setup-password">Nytt passord</label>
        <input id="setup-password" type="password" autocomplete="new-password" />

        <label for="setup-password-confirm">Bekreft passord</label>
        <input id="setup-password-confirm" type="password" autocomplete="new-password" />

        <label for="setup-key">Setup nøkkel (ADMIN_SETUP_KEY)</label>
        <input id="setup-key" type="password" autocomplete="off" />

        <div class="actions">
          <button id="setup-button" type="button">Sett passord</button>
        </div>
      </div>

      <p id="auth-status" class="status"></p>
    </section>

    <section class="card editor-card">
      <div class="editor-toolbar">
        <label for="file-select">Fil</label>
        <select id="file-select"></select>
        <button id="load-file" type="button">Last fil</button>
        <button id="format-json" type="button">Format JSON</button>
      </div>

      <label for="commit-message">Commit-melding</label>
      <input id="commit-message" type="text" value="Admin update" />

      <textarea id="file-editor" spellcheck="false" aria-label="File editor" disabled></textarea>

      <div class="actions">
        <button id="save-file" type="button" disabled>Lagre til GitHub</button>
      </div>

      <div class="meta-row">
        <p id="file-meta" class="status"></p>
        <p id="save-status" class="status"></p>
      </div>
    </section>

    <section class="card quick-card">
      <h2>Hurtigfiler</h2>
      <div class="quick-actions">
        <button class="quick-open" data-path="assets/data/kling3-prompts.json" type="button" disabled>Kling prompts</button>
        <button class="quick-open" data-path="index.html" type="button" disabled>Forside HTML</button>
        <button class="quick-open" data-path="assets/css/style.css" type="button" disabled>Forside CSS</button>
        <button class="quick-open" data-path="assets/js/main.js" type="button" disabled>Forside JS</button>
      </div>
      <p>Tips: `Cmd/Ctrl + S` lagrer aktiv fil.</p>
    </section>
  </main>

  <script src="/admin/admin.js"></script>
</body>
</html>
